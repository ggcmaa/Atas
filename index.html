<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Atas | Metodologia 5W2H</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- html2pdf.js para exportação direta em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- PDF.js para leitura e extração de texto de PDFs importados -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#2F834A',
                            greenHover: '#25693b',
                            lime: '#C5D94D',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            #preview-modal { position: static !important; background: white !important; padding: 0 !important; }
            #preview-content { box-shadow: none !important; border: none !important; max-width: 100% !important; color: black !important; background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-green selection:text-white">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 no-print">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-brand-green flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-green/20">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Gestão de Atas <span class="text-xs font-semibold px-2 py-0.5 rounded bg-brand-lime/20 text-brand-lime border border-brand-lime/30">5W2H</span>
                    </h1>
                    <p class="text-xs text-slate-400">Leitura de PDF, edição estruturada e exportação</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <!-- Botão de Importação de PDF -->
                <label class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-brand-lime border border-slate-700 cursor-pointer transition flex items-center gap-2" title="Importar e estruturar ata existente em PDF">
                    <i class="fa-solid fa-file-arrow-up"></i> Importar PDF (5W2H)
                    <input type="file" id="import-pdf-input" accept=".pdf" class="hidden" onchange="importarAtaPDF(event)">
                </label>
                <button type="button" onclick="limparFormulario()" class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-red-950/50 hover:text-red-400 text-slate-300 border border-slate-700 transition">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Limpar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8 no-print">

        <!-- Seção 1: Dados Gerais da Reunião -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center gap-2 mb-5 pb-3 border-b border-slate-800">
                <span class="w-2 h-6 rounded-full bg-brand-green"></span>
                <h2 class="text-base font-semibold text-white uppercase tracking-wider">1. Informações Gerais da Reunião</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <!-- Seleção da Área -->
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Área *</label>
                    <select id="ata-area" required
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                        <option value="ADM">ADM - Administrativo</option>
                        <option value="IND">IND - Industrial</option>
                        <option value="AGR">AGR - Agrícola</option>
                        <option value="RH">RH - Recursos Humanos</option>
                        <option value="AUT">AUT - Automotiva</option>
                    </select>
                </div>

                <!-- Título / Assunto -->
                <div class="md:col-span-9">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Assunto / Título da Reunião *</label>
                    <input type="text" id="ata-titulo" placeholder="Ex: Alinhamento de Indicadores de Produção" required
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Data *</label>
                    <input type="date" id="ata-data" required
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Horário</label>
                    <input type="time" id="ata-hora"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                </div>

                <!-- Seleção da Unidade -->
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Unidade *</label>
                    <select id="ata-local" required
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                        <option value="CA">CA - Centro Administrativo</option>
                        <option value="UVT">UVT - Usina Vale do Tijuco</option>
                        <option value="UCP">UCP - Usina Canápolis</option>
                        <option value="UVP">UVP - Usina Vale do Pontal</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Organizador / Redator da Ata</label>
                    <input type="text" id="ata-organizador" placeholder="Seu nome e cargo"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition">
                </div>

                <div class="md:col-span-12">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Contexto / Resumo Executivo da Pauta</label>
                    <textarea id="ata-contexto" rows="2" placeholder="Breve resumo dos tópicos abordados..."
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-green transition"></textarea>
                </div>
            </div>
        </section>

        <!-- Seção 2: Envolvidos (Nomes Completos Dinâmicos) -->
        <section class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-6 rounded-full bg-brand-lime"></span>
                    <h2 class="text-base font-semibold text-white uppercase tracking-wider">2. Envolvidos (Nome Completo)</h2>
                </div>
                <button type="button" onclick="adicionarParticipante()"
                    class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-brand-lime border border-slate-700 text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Adicionar Participante
                </button>
            </div>

            <div id="lista-participantes" class="space-y-3">
                <!-- Inserido via JS -->
            </div>
        </section>

        <!-- Seção 3: Plano de Ação 5W2H -->
        <section class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-6 rounded-full bg-brand-green"></span>
                    <h2 class="text-base font-semibold text-white uppercase tracking-wider">3. Deliberações e Plano de Ação (5W2H)</h2>
                </div>
                <button type="button" onclick="adicionarItem5W2H()"
                    class="px-4 py-2 rounded-lg bg-brand-green hover:bg-brand-greenHover text-white text-sm font-medium shadow-lg shadow-brand-green/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Adicionar Ação 5W2H
                </button>
            </div>

            <div id="lista-5w2h" class="space-y-4">
                <!-- Inserido via JS -->
            </div>
        </section>

        <!-- Barra de Ações Finais -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div class="text-xs text-slate-400">
                <i class="fa-solid fa-file-pdf text-brand-lime mr-1"></i> Gere o PDF oficial com todos os detalhes estruturados em 5W2H.
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button type="button" onclick="abrirPreview()"
                    class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-eye text-brand-lime"></i> Visualizar Retrato da Ata
                </button>
                <button type="button" onclick="gerarPDF()"
                    class="px-6 py-2.5 rounded-xl bg-brand-green hover:bg-brand-greenHover text-white text-sm font-semibold shadow-lg shadow-brand-green/30 transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Gerar e Baixar PDF
                </button>
            </div>
        </div>
    </main>

    <!-- Modal: Retrato da Ata -->
    <div id="preview-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden overflow-y-auto p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-t-2xl px-6 py-4 no-print">
                <span class="text-sm font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-brand-lime"></i> Retrato Oficial da Ata (Pronto para PDF)
                </span>
                <div class="flex items-center gap-2">
                    <button onclick="gerarPDF()" class="px-3 py-1.5 rounded-lg bg-brand-green hover:bg-brand-greenHover text-xs text-white font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download"></i> Baixar PDF
                    </button>
                    <button onclick="fecharPreview()" class="ml-2 text-slate-400 hover:text-white text-lg px-2">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="preview-content" class="bg-slate-900 border-x border-b border-slate-700 rounded-b-2xl p-6 md:p-10 text-slate-200 space-y-6 shadow-2xl"></div>
        </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden transform transition-all duration-300 no-print">
        <div class="bg-slate-800 border border-brand-green text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm">
            <i id="toast-icon" class="fa-solid fa-circle-check text-brand-lime text-lg"></i>
            <span id="toast-msg">Operação realizada!</span>
        </div>
    </div>

    <script>
        let itemCount = 0;
        let participantCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('ata-data').valueAsDate = new Date();
            adicionarParticipante();
            adicionarItem5W2H();
        });

        // --- IMPORTAÇÃO E LEITURA DE PDF ---
        async function importarAtaPDF(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarToast('Lendo e estruturando PDF...', 'sucesso');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let textoCompleto = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const textItems = textContent.items.map(item => item.str);
                    textoCompleto += textItems.join(' ') + '\n';
                }

                processarTextoImportado(textoCompleto);
                mostrarToast('Ata importada e estruturada com sucesso!', 'sucesso');
            } catch (err) {
                console.error(err);
                mostrarToast('Erro ao ler o arquivo PDF. Verifique o formato.', 'erro');
            } finally {
                event.target.value = ''; // Limpa input file
            }
        }

        function processarTextoImportado(texto) {
            // Tenta extrair Área (ADM, IND, AGR, RH, AUT)
            const areasValidas = ['ADM', 'IND', 'AGR', 'RH', 'AUT'];
            for (let a of areasValidas) {
                if (texto.toUpperCase().includes(a)) {
                    document.getElementById('ata-area').value = a;
                    break;
                }
            }

            // Tenta extrair Unidade (CA, UVT, UCP, UVP)
            const unidadesValidas = ['CA', 'UVT', 'UCP', 'UVP'];
            for (let u of unidadesValidas) {
                if (new RegExp(`\\b${u}\\b`, 'i').test(texto)) {
                    document.getElementById('ata-local').value = u;
                    break;
                }
            }

            // Tenta extrair Título da Reunião (Procura por linhas após "Ata de Reunião" ou o cabeçalho)
            const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);
            if (linhas.length > 0) {
                document.getElementById('ata-titulo').value = linhas[0].substring(0, 100);
            }

            // Tenta extrair Data (procura padrão DD/MM/YYYY)
            const matchData = texto.match(/(\d{2})\/(\d{2})\/(\d{4})/);
            if (matchData) {
                document.getElementById('ata-data').value = `${matchData[3]}-${matchData[2]}-${matchData[1]}`;
            }

            // Preenche o contexto bruto com parte do texto extraído para referência
            document.getElementById('ata-contexto').value = "Importado de PDF: " + linhas.slice(1, 4).join(' ');

            // Adiciona uma linha padrão de 5W2H com o texto extraído para edição
            document.getElementById('lista-5w2h').innerHTML = '';
            itemCount = 0;
            adicionarItem5W2H();
            
            const primeiroCard = document.querySelector('.w2h-card');
            if (primeiroCard) {
                primeiroCard.querySelector('[data-field="what"]').value = "Revisar itens da ata importada do documento PDF.";
                primeiroCard.querySelector('[data-field="why"]').value = "Consolidação de pendências e deliberações anteriores.";
            }
        }

        // --- GESTÃO DE PARTICIPANTES ---
        function adicionarParticipante(nome = '') {
            participantCount++;
            const container = document.getElementById('lista-participantes');
            const row = document.createElement('div');
            row.className = 'participant-row flex items-center gap-3 bg-slate-900 border border-slate-800 rounded-xl p-3 shadow';

            row.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-brand-lime/10 border border-brand-lime/30 flex items-center justify-center text-brand-lime font-bold text-xs">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="flex-1">
                    <input type="text" placeholder="Nome completo do envolvido e cargo/área..." value="${nome}" required
                        class="participante-nome w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                </div>
                <button type="button" onclick="removerParticipante(this)" class="text-slate-400 hover:text-red-400 px-3 py-2 transition" title="Remover participante">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            container.appendChild(row);
        }

        function removerParticipante(btn) {
            const rows = document.querySelectorAll('.participant-row');
            if (rows.length === 1) {
                mostrarToast('Mantenha pelo menos 1 participante listado.', 'erro');
                return;
            }
            btn.closest('.participant-row').remove();
        }

        // --- GESTÃO DINÂMICA DE ITENS 5W2H ---
        function adicionarItem5W2H(dados = {}) {
            itemCount++;
            const container = document.getElementById('lista-5w2h');
            const card = document.createElement('div');
            card.className = 'w2h-card bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg relative transition hover:border-slate-700';

            card.innerHTML = `
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800/80">
                    <span class="text-xs font-bold uppercase tracking-wider text-brand-lime flex items-center gap-2">
                        <span class="w-6 h-6 rounded-md bg-brand-green/20 border border-brand-green/40 flex items-center justify-center text-white item-number">#</span>
                        Item do Plano de Ação
                    </span>
                    <button type="button" onclick="removerItem5W2H(this)" class="text-xs text-slate-400 hover:text-red-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> Remover
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-6">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">WHAT</span> — O que será feito? *</label>
                        <input type="text" data-field="what" value="${dados.what || ''}" placeholder="Descreva a ação ou entrega..." required
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-6">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">WHY</span> — Por que será feito?</label>
                        <input type="text" data-field="why" value="${dados.why || ''}" placeholder="Objetivo ou benefício esperado..."
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">WHO</span> — Quem é o responsável? *</label>
                        <input type="text" data-field="who" value="${dados.who || ''}" placeholder="Nome do responsável" required
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">WHEN</span> — Quando? (Prazo) *</label>
                        <input type="date" data-field="when" value="${dados.when || ''}" required
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">WHERE</span> — Onde? (Local / Sistema)</label>
                        <input type="text" data-field="where" value="${dados.where || ''}" placeholder="Ex: Setor / Sistema"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-8">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">HOW</span> — Como será executado?</label>
                        <input type="text" data-field="how" value="${dados.how || ''}" placeholder="Método ou fluxo..."
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-300 mb-1"><span class="text-brand-lime">HOW MUCH</span> — Custo / Recursos</label>
                        <input type="text" data-field="howMuch" value="${dados.howMuch || ''}" placeholder="Ex: Sem custo"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-green">
                    </div>
                </div>
            `;
            container.appendChild(card);
            renumerarItens();
        }

        function removerItem5W2H(btn) {
            const cards = document.querySelectorAll('.w2h-card');
            if (cards.length === 1) {
                mostrarToast('A ata precisa ter pelo menos 1 item de ação.', 'erro');
                return;
            }
            btn.closest('.w2h-card').remove();
            renumerarItens();
        }

        function renumerarItens() {
            document.querySelectorAll('.w2h-card').forEach((card, index) => {
                card.querySelector('.item-number').textContent = index + 1;
            });
        }

        // --- COLETA DE DADOS ---
        function coletarDadosAta() {
            const area = document.getElementById('ata-area').value;
            const titulo = document.getElementById('ata-titulo').value.trim();
            const dataRaw = document.getElementById('ata-data').value;
            const dataFormatada = dataRaw ? dataRaw.split('-').reverse().join('/') : 'Não informada';
            const hora = document.getElementById('ata-hora').value || 'Não informada';
            const unidade = document.getElementById('ata-local').value;
            const organizador = document.getElementById('ata-organizador').value.trim() || 'Não informado';
            const contexto = document.getElementById('ata-contexto').value.trim();

            const participantes = [];
            document.querySelectorAll('.participante-nome').forEach(input => {
                if (input.value.trim()) participantes.push(input.value.trim());
            });

            const acoes = [];
            document.querySelectorAll('.w2h-card').forEach((card, idx) => {
                const whenRaw = card.querySelector('[data-field="when"]').value;
                acoes.push({
                    numero: idx + 1,
                    what: card.querySelector('[data-field="what"]').value.trim(),
                    why: card.querySelector('[data-field="why"]').value.trim() || '-',
                    who: card.querySelector('[data-field="who"]').value.trim(),
                    when: whenRaw ? whenRaw.split('-').reverse().join('/') : 'A definir',
                    where: card.querySelector('[data-field="where"]').value.trim() || '-',
                    how: card.querySelector('[data-field="how"]').value.trim() || '-',
                    howMuch: card.querySelector('[data-field="howMuch"]').value.trim() || '-'
                });
            });

            return { area, titulo, data: dataFormatada, hora, unidade, organizador, contexto, participantes, acoes };
        }

        function gerarHtmlRetrato(dados) {
            const linhasParticipantes = dados.participantes.map(p => `<li style="margin-bottom: 4px;">${p}</li>`).join('');
            const linhasTabela = dados.acoes.map(a => `
                <tr style="border-bottom: 1px solid #cbd5e1;">
                    <td style="padding: 10px; font-weight: bold; color: #166534;">#${a.numero}</td>
                    <td style="padding: 10px; color: #0f172a;"><strong>${a.what || '<em>Não preenchido</em>'}</strong><br><span style="font-size: 11px; color: #475569;">Por quê: ${a.why}</span></td>
                    <td style="padding: 10px; color: #0f172a;">${a.who || '-'}</td>
                    <td style="padding: 10px; white-space: nowrap; color: #0f172a;">${a.when}</td>
                    <td style="padding: 10px; font-size: 12px; color: #0f172a;">
                        <div><strong>Onde:</strong> ${a.where}</div>
                        <div><strong>Como:</strong> ${a.how}</div>
                        <div><strong>Custo:</strong> ${a.howMuch}</div>
                    </td>
                </tr>
            `).join('');

            return `
                <div style="font-family: Arial, sans-serif; color: #0f172a; background-color: #ffffff; padding: 30px; border-radius: 12px;">
                    <div style="border-left: 6px solid #2F834A; padding-left: 16px; margin-bottom: 24px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; background-color: #2F834A; color: #ffffff; padding: 2px 8px; border-radius: 4px; font-weight: bold;">Área: ${dados.area}</span>
                            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #2F834A; font-weight: bold;">Ata de Reunião • 5W2H</span>
                        </div>
                        <h1 style="margin: 4px 0 0 0; font-size: 22px; color: #0f172a;">${dados.titulo || 'Reunião Sem Título'}</h1>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;">
                        <tr>
                            <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Data:</strong> ${dados.data}</td>
                            <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Horário:</strong> ${dados.hora}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Unidade:</strong> ${dados.unidade}</td>
                            <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Organizador:</strong> ${dados.organizador}</td>
                        </tr>
                        <tr>
                            <td colspan="2" style="padding: 10px 14px;">
                                <strong>Participantes Envolvidos (${dados.participantes.length}):</strong>
                                <ul style="margin: 6px 0 0 16px; padding: 0; font-size: 12px; color: #334155;">
                                    ${linhasParticipantes || '<li>Nenhum participante informado</li>'}
                                </ul>
                            </td>
                        </tr>
                    </table>

                    ${dados.contexto ? `
                        <div style="margin-bottom: 20px; background-color: #f8fafc; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;">
                            <strong style="color: #2F834A; display: block; margin-bottom: 4px;">Resumo / Contexto da Pauta:</strong>
                            <p style="margin: 0; color: #334155; line-height: 1.5;">${dados.contexto}</p>
                        </div>
                    ` : ''}

                    <h2 style="font-size: 15px; color: #2F834A; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #2F834A; padding-bottom: 4px;">Plano de Ação 5W2H</h2>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; background-color: #ffffff; border: 1px solid #e2e8f0;">
                            <thead>
                                <tr style="background-color: #2F834A; color: #ffffff;">
                                    <th style="padding: 10px;">#</th>
                                    <th style="padding: 10px;">O Quê (What) / Por Quê (Why)</th>
                                    <th style="padding: 10px;">Quem (Who)</th>
                                    <th style="padding: 10px;">Prazo (When)</th>
                                    <th style="padding: 10px;">Detalhes (Where / How / Custo)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${linhasTabela}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function abrirPreview() {
            const dados = coletarDadosAta();
            if (!dados.titulo) {
                mostrarToast('Informe o título da reunião antes de visualizar.', 'erro');
                document.getElementById('ata-titulo').focus();
                return;
            }
            document.getElementById('preview-content').innerHTML = gerarHtmlRetrato(dados);
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function fecharPreview() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function gerarPDF() {
            const dados = coletarDadosAta();
            if (!dados.titulo) {
                mostrarToast('Informe o título da reunião antes de gerar o PDF.', 'erro');
                document.getElementById('ata-titulo').focus();
                return;
            }

            const elementoTemp = document.createElement('div');
            elementoTemp.innerHTML = gerarHtmlRetrato(dados);
            
            const opt = {
                margin:        10,
                filename:      `Ata_${dados.area}_${dados.unidade}_${dados.titulo.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
                image:         { type: 'jpeg', quality: 0.98 },
                html2canvas:   { scale: 2, useCORS: true },
                jsPDF:         { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            mostrarToast('Gerando PDF oficial...', 'sucesso');
            html2pdf().from(elementoTemp).set(opt).save().then(() => {
                mostrarToast('PDF gerado e baixado com sucesso!', 'sucesso');
                fecharPreview();
            });
        }

        function limparFormulario() {
            if (!confirm('Deseja limpar todos os campos preenchidos?')) return;
            document.getElementById('ata-titulo').value = '';
            document.getElementById('ata-hora').value = '';
            document.getElementById('ata-organizador').value = '';
            document.getElementById('ata-contexto').value = '';
            document.getElementById('lista-participantes').innerHTML = '';
            document.getElementById('lista-5w2h').innerHTML = '';
            participantCount = 0;
            itemCount = 0;
            adicionarParticipante();
            adicionarItem5W2H();
            mostrarToast('Formulário reiniciado.', 'sucesso');
        }

        function mostrarToast(msg, tipo) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').textContent = msg;
            if (tipo === 'erro') {
                icon.className = 'fa-solid fa-circle-exclamation text-red-400 text-lg';
            } else {
                icon.className = 'fa-solid fa-circle-check text-brand-lime text-lg';
            }
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
